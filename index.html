<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tafelapp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body>

    <div class="container mt-5">
        <div class="row g-4">

            <!-- Links: tafel laten zien -->
            <div class="col-md-4">
                <div class="card text-center h-100">
                    <div class="card-header">Tafelapp</div>

                    <div class="card-body">
                        <h5 class="card-title">Tafel bekijken</h5>
                        <p class="card-text">Welke tafel wil je bekijken?</p>

                        <input type="number" id="tafelTonen" class="form-control mb-3"
                            min="1" max="10" placeholder="Kies een tafel van 1 t/m 10">

                        <button onclick="showtafel()" class="btn btn-primary">
                            Laat de tafel zien
                        </button>

                        <div id="uitkomstTonen" class="mt-3"></div>
                    </div>

                    <div class="card-footer text-body-secondary">Made by Jayson</div>
                </div>
            </div>

            <!-- Midden: tafels oefenen -->
            <div class="col-md-4">
                <div class="card text-center h-100">
                    <div class="card-header">Tafelapp</div>

                    <div class="card-body">
                        <h5 class="card-title">Tafels oefenen</h5>
                        <p class="card-text">Welke tafel wil je oefenen?</p>

                        <input type="number" id="tafelOefenen" class="form-control mb-3"
                            min="1" max="10" placeholder="Kies een tafel van 1 t/m 10">

                        <button onclick="startOefenen()" class="btn btn-primary">
                            Start oefenen
                        </button>

                        <div id="uitkomstOefenen" class="mt-3"></div>
                    </div>

                    <div class="card-footer text-body-secondary">Made by Jayson</div>
                </div>
            </div>

            <!-- Rechts: Onderdeel 3 -->
            <div class="col-md-4">
                <div class="card text-center h-100">
                    <div class="card-header">Tafelapp</div>

                    <div class="card-body">
                        <h5 class="card-title">Onderdeel 3</h5>
                        <p class="card-text">Hier komt later iets anders.</p>
                    </div>

                    <div class="card-footer text-body-secondary">Made by Jayson</div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="tafelapp.js"></script>

</body>

</html>
